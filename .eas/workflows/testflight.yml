name: TestFlight Release Candidate

on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  deploy_hosting:
    name: Deploy EAS Hosting
    type: deploy
    environment: production
    params:
      prod: true

  build_ios:
    name: Build iOS Release Candidate
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  upload_testflight:
    name: Upload to TestFlight
    type: submit
    needs: [build_ios, deploy_hosting]
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
