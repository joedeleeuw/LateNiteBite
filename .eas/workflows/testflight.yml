name: TestFlight Release Candidate

on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_ios:
    name: Build iOS Release Candidate
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  upload_testflight:
    name: Upload to TestFlight
    type: submit
    needs: [build_ios]
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
