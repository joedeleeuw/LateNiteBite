name: Release

on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  deploy_hosting:
    name: Deploy EAS Hosting
    type: deploy
    environment: production
    params:
      prod: true

  build_ios:
    name: Build iOS
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    type: build
    environment: production
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit iOS
    type: submit
    needs: [build_ios, deploy_hosting]
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Submit Android
    type: submit
    needs: [build_android, deploy_hosting]
    environment: production
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
