appId: ${APP_ID}
name: ios right now live smoke
tags:
  - smoke
  - ios
  - live-data
env:
  APP_ID: com.joedeleeuw.latenitebite
---
- setLocation:
    latitude: 30.4419
    longitude: -84.2985
- launchApp:
    clearState: true
    permissions:
      location: inuse
- extendedWaitUntil:
    visible:
      id: "lnb_spot_row"
    timeout: 60000
- assertVisible:
    id: "lnb_spot_list"
- assertNotVisible:
    id: "lnb_location_required"
- tapOn:
    id: "lnb_spot_row"
- extendedWaitUntil:
    visible:
      id: "lnb_spot_detail"
    timeout: 45000
- assertVisible:
    id: "lnb_spot_detail_state"
- assertVisible:
    id: "lnb_navigate_button"
- assertNotVisible:
    id: "lnb_spot_missing"
