name: iOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile assets
        run: pnpm assets

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios
        env:
          NODE_ENV: production

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/LateNiteBite.xcworkspace \
            -scheme LateNiteBite \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO
        env:
          NODE_ENV: production
